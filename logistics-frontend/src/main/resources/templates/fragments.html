<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | Defence Logistics'">Defence Logistics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<aside th:fragment="sidebar(active)" class="sidebar">
  <a class="brand" th:href="@{/}">
    <span class="brand-mark"><i class="bi bi-shield-shaded"></i></span>
    <span class="brand-text"><b>Defence Logistics</b><small>Command console</small></span>
  </a>
  <nav class="menu">
    <div class="menu-label">Overview</div>
    <a class="nav-link-x" th:classappend="${active == 'dashboard'} ? 'active'" th:href="@{/}"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></a>
    <a class="nav-link-x" th:classappend="${active == 'requests'} ? 'active'" th:href="@{/m/requests}"><i class="bi bi-clipboard-check"></i><span>Requests</span></a>

    <div class="menu-label">Resources</div>
    <a class="nav-link-x" th:classappend="${active == 'personnel'} ? 'active'" th:href="@{/m/personnel}"><i class="bi bi-people"></i><span>Personnel</span></a>
    <a class="nav-link-x" th:classappend="${active == 'units'} ? 'active'" th:href="@{/m/units}"><i class="bi bi-diagram-3"></i><span>Units</span></a>
    <a class="nav-link-x" th:classappend="${active == 'equipment'} ? 'active'" th:href="@{/m/equipment}"><i class="bi bi-hdd-rack"></i><span>Equipment</span></a>
    <a class="nav-link-x" th:classappend="${active == 'vehicles'} ? 'active'" th:href="@{/m/vehicles}"><i class="bi bi-truck"></i><span>Vehicles</span></a>
    <a class="nav-link-x" th:classappend="${active == 'supplies'} ? 'active'" th:href="@{/m/supplies}"><i class="bi bi-box-seam"></i><span>Supplies</span></a>

    <div class="menu-label">Operations</div>
    <a class="nav-link-x" th:classappend="${active == 'allocations'} ? 'active'" th:href="@{/m/allocations}"><i class="bi bi-link-45deg"></i><span>Allocations</span></a>
    <a class="nav-link-x" th:classappend="${active == 'maintenance'} ? 'active'" th:href="@{/m/maintenance}"><i class="bi bi-wrench-adjustable"></i><span>Maintenance</span></a>
  </nav>
  <a class="signout" th:href="@{/logout}"><i class="bi bi-box-arrow-left"></i><span>Sign out</span></a>
</aside>

<header th:fragment="topbar(title)" class="topbar">
  <div class="crumb"><span>Home</span><i class="bi bi-chevron-right"></i><b th:text="${title}">Page</b></div>
  <div class="top-right">
    <span class="sys"><span class="dot"></span> System operational</span>
    <span class="userchip">
      <span class="avatar" th:text="${#strings.isEmpty(user) ? '?' : #strings.substring(user,0,1)}">A</span>
      <span th:text="${user}">User</span>
    </span>
  </div>
</header>

<div th:fragment="flash" th:if="${msg != null}" class="toast-msg" th:classappend="${ok} ? 'good' : 'bad'">
  <i class="bi" th:classappend="${ok} ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'"></i>
  <span th:text="${msg}"></span>
</div>

</body>
</html>
